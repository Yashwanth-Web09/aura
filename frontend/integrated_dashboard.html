    <script>
        /* ============================================================
               AURA DASHBOARD — DATA ENGINE
               STEP 5A
               ============================================================ */

        const db = window.supabaseClient;

        if (!db) {
            console.error("AURA: Supabase client not found.");
            window.location.replace("login.html");
        }


        /* ============================================================
           GLOBAL DASHBOARD STATE
           ============================================================ */

        const dashboardState = {

            user: null,

            profile: null,

            body_metrics: null,

            lifestyle_profile: null,

            user_goals: [],

            user_preferences: [],

            user_conditions: [],

            user_medications: [],

            metrics: null,

            user_units: null,

            health_plan: null,

            workout_plan: null,

            diet_plan: null,

            workout_days: [],

            diet_days: [],

            aura_transactions: [],

            user_streaks: null,

            user_badges: [],

            weight_logs: [],

            exercise_logs: [],

            nutrition_logs: [],

            water_logs: [],

            sleep_logs: [],

            ai_recommendations: [],

            calculated: {

                bmi: null,

                bmiCategory: null,

                bmiRisk: null,

                healthyWeightMin: null,

                healthyWeightMax: null,

                goalDate: null,

                countdown: null,

                auraTotal: 0

            },

            planStatus: {

                exists: false,

                stale: false,

                needsGeneration: false

            }

        };


        /* ============================================================
           INITIALIZATION
           ============================================================ */

        document.addEventListener("DOMContentLoaded", async () => {

            console.log("AURA DASHBOARD: Initializing...");

            await initializeDashboard();

        });


        /* ============================================================
           MAIN INITIALIZER
           ============================================================ */

        async function initializeDashboard() {

            try {

                const sessionResult =
                    await db.auth.getSession();

                if (sessionResult.error) {
                    throw sessionResult.error;
                }

                const refreshResult =
                    await db.auth.refreshSession();

                if (refreshResult.error) {
                    throw refreshResult.error;
                }

                const session =
                    refreshResult.data?.session;

                if (!session) {
                    console.warn(
                        "AURA DASHBOARD: No active session."
                    );
                    window.location.replace("login.html");
                    return;
                }

                dashboardState.user = session.user;

                console.log(
                    "AURA DASHBOARD USER:",
                    dashboardState.user.id
                );

                await loadDashboardData();

                calculateDashboardMetrics();

                await loadHealthPlanState();

                await ensureHealthPlan();

                await ensurePlanContainers();

                await generateWorkoutDays_5C2();

                await generateDietDays_5C12();

                try {

                    await applyTodayAuraAIPlan_19H();

                    console.log(
                        "AURA DASHBOARD: AI daily plan ready."
                    );

                } catch (aiError) {

                    console.error(
                        "AURA DASHBOARD: AI daily plan failed:",
                        aiError
                    );

                }

                console.log(
                    "AURA DASHBOARD STATE:",
                    dashboardState
                );

                console.log(
                    "AURA DASHBOARD: Data engine ready."
                );

            } catch (error) {

                console.error(
                    "AURA DASHBOARD INITIALIZATION ERROR:",
                    error
                );

            }

        }

        /* ============================================================
           LOAD EXISTING USER DATA
           ============================================================ */

                    .maybeSingle(),

                    .from("lifestyle_profile")
                    .select("*")
                    .eq("user_id", userId)
                    .maybeSingle(),

                db
                    .from("user_goals")
                    .select("*")
                    .eq("user_id", userId),

                db
                    .from("user_preferences")
                    .select("*")
                    .eq("user_id", userId),

                db
                    .from("user_conditions")
                    .select("*")
                    .eq("user_id", userId),

                db
                    .from("user_medications")
                    .select("*")
                    .eq("user_id", userId),

                db
                    .from("user_units")
                    .select("*")
                    .eq("user_id", userId)

               -------------------------------------------------------- */

        /* ============================================================
           CALCULATE HEALTH METRICS
           ============================================================ */

        function calculateDashboardMetrics() {

            const body = dashboardState.body_metrics;

            if (!body) {

                console.warn(
                    "AURA: Body metrics unavailable."
                );

                return;
            }


            const heightCm =
                Number(body.height_cm);

            const weightKg =
                Number(body.weight_kg);


            if (!Number.isFinite(heightCm) ||
                !Number.isFinite(weightKg) ||
                heightCm <= 0 ||
                weightKg <= 0
            ) {

                console.warn(
                    "AURA: Invalid height/weight."
                );

                return;
            }


            const heightM =
                heightCm / 100;


            const bmi =
                weightKg / (heightM * heightM);


            dashboardState.calculated.bmi =
                Number(bmi.toFixed(1));


            /* --------------------------------------------------------
               BMI CATEGORY
               -------------------------------------------------------- */

            let category = "";
            let risk = "";


            if (bmi < 18.5) {

                category = "Underweight";
                risk = "Low";

            } else if (bmi < 25) {

                category = "Healthy";
                risk = "Low";

            } else if (bmi < 30) {

                category = "Overweight";
                risk = "Risky";

            } else if (bmi < 35) {

                category = "Obesity";
                risk = "High";

            } else {

                category = "Severe Obesity";
                risk = "Very High";

            }


            dashboardState.calculated.bmiCategory =
                category;

            dashboardState.calculated.bmiRisk =
                risk;


            /* --------------------------------------------------------
               HEALTHY WEIGHT RANGE
               -------------------------------------------------------- */

            const healthyMin =
                18.5 * (heightM * heightM);

            const healthyMax =
                24.9 * (heightM * heightM);


            dashboardState.calculated.healthyWeightMin =
                Number(healthyMin.toFixed(1));

            dashboardState.calculated.healthyWeightMax =
                Number(healthyMax.toFixed(1));


            /* --------------------------------------------------------
               GOAL DATE
               -------------------------------------------------------- */

            const primaryGoal =
                dashboardState.user_goals.find(
                    goal => goal.primary_goal === true
                );

            const dateGoal =
                dashboardState.user_goals.find(
                    goal => goal.target_date
                );


            dashboardState.calculated.goalDate =
                primaryGoal?.target_date ||
                dateGoal?.target_date ||
                null;


            console.log(
                "AURA CALCULATED METRICS:",
                dashboardState.calculated
            );

        }



        /* ============================================================
           LOAD HEALTH PLAN
           ============================================================ */

        async function loadHealthPlanState() {

            const userId =
                dashboardState.user.id;


            const {
                data,
                error
            } = await db
                .from("health_plans")
                .select("*")
                .eq("user_id", userId)
                .eq("status", "active")
                .order("created_at", {
                    ascending: false
                })
                .limit(1)
                .maybeSingle();


            if (error) {

                console.error(
                    "AURA HEALTH PLAN ERROR:",
                    error
                );

                return;
            }


            dashboardState.health_plan =
                data || null;


            dashboardState.planStatus.exists = !!data;


            if (!data) {

                dashboardState.planStatus.needsGeneration =
                    true;

                console.log(
                    "AURA: No active health plan found."
                );

                return;
            }


            /*
             * Compare the current onboarding profile
             * against the snapshot used to generate
             * the existing health plan.
             */

            const currentSnapshot =
                buildRecommendationSnapshot();


            const storedSnapshot =
                data.profile_snapshot || {};


            const currentHash =
                createStableSnapshot(currentSnapshot);

            const storedHash =
                data.profile_hash || "";


            dashboardState.planStatus.stale =
                storedHash !== currentHash;


            dashboardState.planStatus.needsGeneration =
                dashboardState.planStatus.stale;


            console.log(
                "AURA PLAN STATUS:",
                dashboardState.planStatus
            );

        }

        /* ============================================================
   CREATE INITIAL HEALTH PLAN
   ============================================================ */

        async function createInitialHealthPlan() {

            const userId =
                dashboardState.user.id;

            const snapshot =
                buildRecommendationSnapshot();

            const profileHash =
                createStableSnapshot(snapshot);


            const goal =
                getPrimaryGoal();


            const payload = {

                user_id: userId,

                goal_id: goal?.id || null,

                goal_date: goal?.target_date || null,

                status: "active",

                profile_snapshot: snapshot,

                profile_hash: profileHash

            };


            console.log(
                "AURA: Creating initial health plan...",
                payload
            );


            const {
                data,
                error
            } = await db
                .from("health_plans")
                .insert(payload)
                .select()
                .single();


            if (error) {

                console.error(
                    "AURA HEALTH PLAN CREATE ERROR:",
                    error
                );

                throw error;

            }


            dashboardState.health_plan =
                data;

            dashboardState.planStatus = {

                exists: true,

                stale: false,

                needsGeneration: true

            };


            console.log(
                "AURA: INITIAL HEALTH PLAN CREATED:",
                data
            );


            return data;

        }

        /* ============================================================
           ENSURE HEALTH PLAN EXISTS
           ============================================================ */

            if (
                dashboardState.planStatus.exists &&
                dashboardState.health_plan

                    "AURA: Existing health plan found."
                );

                return dashboardState.health_plan;

            }


            console.log(
                "AURA: Creating first health plan..."

            return await createInitialHealthPlan();

        /* ============================================================
   AURA — PLAN DATE ENGINE
   ============================================================ */

        function getPlanDates(startDate, goalDate) {
            const dates = [];

            // Treat these as calendar dates, not timestamps.
            const [startYear, startMonth, startDay] = startDate
                .split("-")
                .map(Number);

            const [endYear, endMonth, endDay] = goalDate
                .split("-")
                .map(Number);

            const cursor = new Date(
                startYear,
                startMonth - 1,
                startDay
            );

            const end = new Date(
                endYear,
                endMonth - 1,
                endDay
            );

            if (
                Number.isNaN(cursor.getTime()) ||
                Number.isNaN(end.getTime())
            ) {
                throw new Error("Invalid plan dates.");
            }

            if (end < cursor) {
                throw new Error(
                    "Goal date cannot be before the plan start date."
                );
            }

            while (cursor <= end) {

                const year = cursor.getFullYear();
                const month = String(
                    cursor.getMonth() + 1
                ).padStart(2, "0");
                const day = String(
                    cursor.getDate()
                ).padStart(2, "0");

                dates.push(`${year}-${month}-${day}`);

                cursor.setDate(
                    cursor.getDate() + 1
                );
            }

            return dates;
        }

        /* ============================================================
           AURA — WORKOUT PHASE ENGINE
           ============================================================ */

        function getWorkoutPhase(dayNumber, totalDays) {

            const progress =
                totalDays <= 1 ?
                    1 :
                    (dayNumber - 1) / (totalDays - 1);


            if (progress < 0.20) {

                return {
                    key: "foundation",
                    name: "Foundation",
                    intensity: "low"
                };

            }


            if (progress < 0.45) {

                return {
                    key: "conditioning",
                    name: "Conditioning",
                    intensity: "moderate"
                };

            }


            if (progress < 0.70) {

                return {
                    key: "strength",
                    name: "Strength",
                    intensity: "moderate"
                };

            }


            if (progress < 0.90) {

                return {
                    key: "progression",
                    name: "Progression",
                    intensity: "moderate_high"
                };

            }


            return {
                key: "maintenance",
                name: "Maintenance",
                intensity: "moderate"
            };

        }

        /* ============================================================
           AURA — WORKOUT TEMPLATE ENGINE
           ============================================================ */

        function buildWorkoutTemplate({
            dayNumber,
            totalDays,
            metrics,
            lifestyle,
            goals,
            conditions,
            medications
        }) {

            const phase =
                getWorkoutPhase(
                    dayNumber,
                    totalDays
                );


            const activity =
                lifestyle?.activity_level ||
                "sedentary";


            const primaryGoal =
                goals?.primary_goal ||
                "General Wellness";


            const conditionCount =
                Array.isArray(conditions) ?
                    conditions.length :
                    0;


            const medicationCount =
                Array.isArray(medications) ?
                    medications.length :
                    0;


            /*
         Safety-first baseline.

         We deliberately keep the initial
         generator conservative.
      */

            let exercises = [];


            if (
                phase.key === "foundation"
            ) {

                exercises = [

                    {
                        name: "Easy Walk",
                        type: "cardio",
                        duration_minutes: 15
                    },

                    {
                        name: "Gentle Mobility",
                        type: "mobility",
                        duration_minutes: 10
                    },

                    {
                        name: "Bodyweight Sit-to-Stand",
                        type: "strength",
                        sets: 2,
                        reps: 8
                    }

                ];

            } else if (
                phase.key === "conditioning"
            ) {

                exercises = [

                    {
                        name: "Brisk Walk",
                        type: "cardio",
                        duration_minutes: 20
                    },

                    {
                        name: "Bodyweight Squat",
                        type: "strength",
                        sets: 2,
                        reps: 10
                    },

                    {
                        name: "Wall Push-Up",
                        type: "strength",
                        sets: 2,
                        reps: 8
                    },

                    {
                        name: "Mobility Flow",
                        type: "mobility",
                        duration_minutes: 10
                    }

                ];

            } else if (
                phase.key === "strength"
            ) {

                exercises = [

                    {
                        name: "Warm-Up Walk",
                        type: "cardio",
                        duration_minutes: 10
                    },

                    {
                        name: "Bodyweight Squat",
                        type: "strength",
                        sets: 3,
                        reps: 10
                    },

                    {
                        name: "Incline Push-Up",
                        type: "strength",
                        sets: 3,
                        reps: 8
                    },

                    {
                        name: "Glute Bridge",
                        type: "strength",
                        sets: 3,
                        reps: 10
                    },

                    {
                        name: "Easy Cooldown",
                        type: "mobility",
                        duration_minutes: 8
                    }

                ];

            } else {

                exercises = [

                    {
                        name: "Moderate Walk",
                        type: "cardio",
                        duration_minutes: 25
                    },

                    {
                        name: "Full Body Mobility",
                        type: "mobility",
                        duration_minutes: 10
                    },

                    {
                        name: "Bodyweight Strength Circuit",
                        type: "strength",
                        sets: 3,
                        reps: 10
                    }

                ];

            }


            return {

                phase: phase.name,

                intensity: phase.intensity,

                primary_goal: primaryGoal,

                activity_level: activity,

                exercises,

                personalization: {

                    bmi: metrics?.bmi ?? null,

                    condition_count: conditionCount,

                    medication_count: medicationCount

                }

            };

        }

        /* ============================================================
           AURA — GENERATE WORKOUT DAYS
           ============================================================ */

        async function generateWorkoutDays() {

            const plan = dashboardState.workout_plan;

            if (!plan?.id) {
                throw new Error("Workout plan container not found.");
            }

            const dates = getPlanDates(
                plan.start_date,
                plan.goal_date
            );

            console.log(
                "AURA DEBUG GENERATED DATES:",
                dates.slice(0, 3)
            );

            console.log(
                "AURA DEBUG FIRST DATE:",
                dates[0]
            );

            console.log(
                "AURA DEBUG LAST DATE:",
                dates[dates.length - 1]
            );

            console.log(
                "AURA: Workout generation range:",
                plan.start_date,
                "→",
                plan.goal_date
            );

            console.log(
                "AURA: Total workout days:",
                dates.length
            );


            /* ---------------------------------------------------------
               Check existing days
               --------------------------------------------------------- */

            const {
                data: existingDays,
                error: existingError
            } = await db
                .from("workout_days")
                .select("id, workout_date")
                .eq(
                    "workout_plan_id",
                    plan.id
                );

            if (existingError) {
                throw existingError;
            }

            console.log(
                "AURA DEBUG EXISTING WORKOUT DAYS:",
                existingDays || []
            );

            console.log(
                "AURA DEBUG EXISTING WORKOUT COUNT:",
                (existingDays || []).length
            );


            const existingDates = new Set(
                (existingDays || []).map(
                    row => row.workout_date
                )
            );


            const rows = [];


            /* ---------------------------------------------------------
               Build missing days
               --------------------------------------------------------- */

            for (
                let index = 0; index < dates.length; index++
            ) {

                const date = dates[index];

                if (existingDates.has(date)) {
                    continue;
                }


                const dayNumber = index + 1;

                const period = getPlanPeriod(
                    dayNumber
                );


                const workout = buildWorkoutTemplate({

                    dayNumber,

                    totalDays: dates.length,

                    metrics: dashboardState.metrics,

                    lifestyle: dashboardState.lifestyle_profile,

        function getPlanPeriod(dayNumber) {

            const monthNumber =
                Math.floor((dayNumber - 1) / 28) + 1;

            const weekNumber =
                Math.floor((dayNumber - 1) / 7) + 1;

            return {
                monthNumber,
                weekNumber
            };
        }


        function getWorkoutPhase(dayNumber, totalDays) {

            const progress =
                totalDays <= 1 ?
                    1 :
                    (dayNumber - 1) / (totalDays - 1);


            if (progress < 0.20) {

                return {
                    key: "foundation",
                    name: "Foundation",
                    difficulty: "Beginner",
                    intensity: "low"
                };

            }


            if (progress < 0.45) {

                return {
                    key: "conditioning",
                    name: "Conditioning",
                    difficulty: "Beginner",
                    intensity: "moderate"
                };

            }


            if (progress < 0.70) {

                return {
                    key: "strength",
                    name: "Strength",
                    difficulty: "Moderate",
                    intensity: "moderate"
                };

            }


            if (progress < 0.90) {

                return {
                    key: "progression",
                    name: "Progression",
                    difficulty: "Moderate",
                    intensity: "moderate_high"
                };

            }


            return {
                key: "maintenance",
                name: "Maintenance",
                difficulty: "Moderate",
                intensity: "moderate"
            };
        }

        /* ============================================================
           STABLE SNAPSHOT
           ============================================================ */

        function createStableSnapshot(data) {

            return JSON.stringify(
                normalizeObject(data)
            );

        }


        function normalizeObject(value) {

            if (Array.isArray(value)) {

                return value
                    .map(normalizeObject)
                    .sort((a, b) =>
                        JSON.stringify(a)
                            .localeCompare(JSON.stringify(b))
                    );

            }


            if (
                value &&
                typeof value === "object"
            ) {

                return Object.keys(value)
                    .sort()
                    .reduce((result, key) => {

                        result[key] =
                            normalizeObject(value[key]);

                        return result;

                    }, {});

            }


            return value;

        }

                    error
                );
                throw error;
            }

                "AURA 5C4: Expected dates:",
                dates.length
            );

            console.log(
                "AURA 5C4: Database rows:",
                workoutDays?.length || 0
            );

            const expectedDates = new Set(dates);

            const actualDates = new Set(
                (workoutDays || []).map(
                    row => row.workout_date
                )
            );

            const missingDates = dates.filter(
                date => !actualDates.has(date)
            );

            const unexpectedDates = (workoutDays || [])
                .filter(
                    row => !expectedDates.has(
                        row.workout_date
                    )
                )
                .map(
                    row => row.workout_date
                );

            const duplicateDates = [];

            const seenDates = new Set();

            for (const row of workoutDays || []) {

                if (seenDates.has(row.workout_date)) {

                    duplicateDates.push(
                        row.workout_date
                    );

                } else {

                    seenDates.add(
                        row.workout_date
                    );

                }
            }

            console.log(
                "AURA 5C4: Missing dates:",
                missingDates
            );

            console.log(
                "AURA 5C4: Unexpected dates:",
                unexpectedDates
            );

            console.log(
                "AURA 5C4: Duplicate dates:",
                duplicateDates
            );

            console.table(
                (workoutDays || []).map(row => ({
                    date: row.workout_date,
                    day: row.day_number,
                    month: row.month_number,
                    week: row.week_number,
                    title: row.title
                }))
            );

            return {
                expectedCount: dates.length,
                actualCount: workoutDays?.length || 0,
                missingDates,
                unexpectedDates,
                duplicateDates,
                valid: missingDates.length === 0 &&
                    unexpectedDates.length === 0 &&
                    duplicateDates.length === 0 &&
                    (workoutDays || []).length === dates.length
            };
        }

        /* ============================================================
   AURA 5C10 — WORKOUT PROGRESS / STATS
   ============================================================ */

        async function getWorkoutProgress_5C10() {

            const userId = dashboardState?.user?.id;
            const planId = dashboardState?.workout_plan?.id;

            if (!userId || !planId) {
                throw new Error("Workout context not ready.");
            }

            const {
                data,
                error
            } = await db
                .from("workout_days")
                .select("id,workout_date,day_number,completed,aura_points")
                .eq("user_id", userId)
                .eq("workout_plan_id", planId)
                .order("workout_date", {
                    ascending: true
                });

            if (error) throw error;

            const days = data || [];
            const total = days.length;
            const completed = days.filter(d => d.completed).length;

            const auraEarned = days
                .filter(d => d.completed)
                .reduce((s, d) => s + Number(d.aura_points || 0), 0);

            const completionPercent = total ?
                Math.round((completed / total) * 100) :
                0;

            const completedDates = days
                .filter(d => d.completed)
                .map(d => d.workout_date);

            let longestStreak = 0;
            let streak = 0;

            for (let i = 0; i < days.length; i++) {
                if (days[i].completed) {
                    streak++;
                    longestStreak = Math.max(longestStreak, streak);
                } else {
                    streak = 0;
                }
            }

            let currentStreak = 0;

            for (let i = days.length - 1; i >= 0; i--) {
                if (days[i].completed) currentStreak++;
                else break;
            }

            const result = {
                total,
                completed,
                remaining: total - completed,
                completionPercent,
                auraEarned,
                currentStreak,
                longestStreak,
                completedDates,
                days
            };

            dashboardState.workout_progress = result;

            console.log("AURA 5C10: Workout progress:", result);

            return result;
        }

        async function generateDietDays_5C12() {

            const plan =
                dashboardState.diet_plan;

            if (!plan?.id) {
                throw new Error("Diet plan not found.");
            }

            const dates =
                getPlanDates(
                    plan.start_date,
                    plan.goal_date
                );

            const {
                data: existing,
                error: fetchError
            } = await db
                .from("diet_days")
                .select("diet_date")
                .eq("diet_plan_id", plan.id);

            if (fetchError) {
                throw fetchError;
            }

            const existingDates =
                new Set(
                    (existing || []).map(
                        d => d.diet_date
                    )
                );

            const rows = [];

            for (let i = 0; i < dates.length; i++) {

                const date = dates[i];

                if (existingDates.has(date)) {
                    continue;
                }

                const dayNumber = i + 1;

                const monthNumber =
                    Math.floor((dayNumber - 1) / 28) + 1;

                const weekNumber =
                    Math.floor((dayNumber - 1) / 7) + 1;

                const diet =
                    buildDietDay_5C12({
                        dayNumber,
                        totalDays: dates.length,
                        preferences: dashboardState.user_preferences,
                        metrics: dashboardState.calculated
                    });

                rows.push({

                    diet_plan_id: plan.id,

                    user_id: dashboardState.user.id,

                    diet_date: date,

                    month_number: monthNumber,

                    week_number: weekNumber,

                    day_number: dayNumber,

                    breakfast: diet.breakfast,

                    mid_morning: diet.mid_morning,

                    lunch: diet.lunch,

                    evening: diet.evening,

                    dinner: diet.dinner,

                    notes: diet.notes,

                    completed: false,

                    aura_points: 7
                });
            }

            if (!rows.length) {
                return existing || [];
            }

            const {
                data,
                error
            } = await db
                .from("diet_days")
                .insert(rows)
                .select();

            if (error) {
                console.error(
                    "AURA 5C12: Diet generation failed:",
                    error

                throw error;
            }

            console.log(
                "AURA 5C12: DIET DAYS CREATED:",
                data?.length || 0

            dashboardState.diet_days =
                data || [];

            return data || [];
        }

        function buildWaterSchedule_5C15(
            wakeTime = "07:00"
        ) {

            const [hour, minute] =
                wakeTime.split(":").map(Number);

            const start =
                new Date();

            start.setHours(
                hour,
                minute,
                0,
                0
            );

            const end =
                new Date(start);

            end.setHours(22, 0, 0, 0);

            const slots = [];

            let current =
                new Date(start);

            while (current < end) {

                const hoursLeft =
                    (end - current) / 3600000;

                const amount =
                    hoursLeft > 7 ?
                        250 :
                        hoursLeft > 4 ?
                            200 :
                            150;

                slots.push({
                    time: current.toTimeString()
                        .slice(0, 5),

                    amountMl: amount,

                    drank: false
                });

                current.setHours(
                    current.getHours() + 1
                );
            }

            return slots;
        }

        /* ------------------------------------------------------------
         SLEEP SCORE
         ------------------------------------------------------------ */

        function calculateSleepScore_5C19(hours, quality = "") {

            const h = Number(hours || 0);
            const q = String(quality || "").toLowerCase();

            let score = 0;

            /* Duration: ideal baseline around 7–9 hours */
            if (h >= 7 && h <= 9) {
                score += 70;
            } else if (h >= 6 && h < 7) {
                score += 55;
            } else if (h > 9 && h <= 10) {
                score += 60;
            } else if (h >= 5) {
                score += 40;
            } else {
                score += 20;
            }

            /* Quality */
            if (
                q.includes("excellent") ||
                q.includes("great")
            ) {
                score += 30;
            } else if (
                q.includes("good")
            ) {
                score += 25;
            } else if (
                q.includes("fair") ||
                q.includes("okay") ||
                q.includes("moderate")
            ) {
                score += 15;
            } else if (
                q.includes("poor") ||
                q.includes("bad")
            ) {
                score += 5;
            }

            return Math.min(100, score);
        }

   AURA 5C20 — SLEEP REWARD + STREAK
   ============================================================ */

        async function completeSleepDay_5C20(sleepId) {

            const userId = dashboardState?.user?.id;

            if (!userId || !sleepId) {
                throw new Error("Sleep context not ready.");
            }

            const {
                data: sleep,
                error: sleepError
            } = await db
                .from("sleep_logs")
                .select("*")
                .eq("id", sleepId)
                .eq("user_id", userId)
                .maybeSingle();

            if (sleepError) throw sleepError;

            if (!sleep?.wake_time || sleep.hours == null) {
                throw new Error("Sleep session is not complete.");
            }

            const score =
                calculateSleepScore_5C19(
                    sleep.hours,
                    sleep.quality
                );

            const day =
                new Date(sleep.wake_time)
                    .toISOString()
                    .slice(0, 10);

            const {
                data: existingReward,
                error: rewardCheckError
            } =
                await db
                    .from("aura_transactions")
                    .select("id")
                    .eq("user_id", userId)
                    .eq("transaction_date", day)
                    .eq("source", "sleep")
                    .limit(1);

            if (rewardCheckError) throw rewardCheckError;

            if (existingReward?.length) {
                return {
                    rewarded: false,
                    alreadyRewarded: true,
                    score
                };
            }

            const points =
                score >= 85 ?
                    7 :
                    score >= 70 ?
                        5 :
                        score >= 55 ?
                            3 :
                            0;

            let reward = null;

            if (points > 0) {

                const {
                    data,
                    error
                } = await db
                    .from("aura_transactions")
                    .insert({
                        user_id: userId,
                        transaction_date: day,
                        source: "sleep",
                        source_id: sleep.id,
                        points,
                        description: `Sleep score ${score}`
                    })
                    .select()
                    .single();

                if (error) throw error;

                reward = data;
            }

            const {
                data: streakRow,
                error: streakFetchError
            } =
                await db
                    .from("user_streaks")
                    .select("*")
                    .eq("user_id", userId)
                    .maybeSingle();

            if (streakFetchError) throw streakFetchError;

            const qualifies =
                score >= 70;

            if (qualifies) {

                const current =
                    Number(
                        streakRow?.sleep_current || 0
                    ) + 1;

                const best =
                    Math.max(
                        current,
                        Number(
                            streakRow?.sleep_best || 0
                        )
                    );

                if (streakRow) {

                    const {
                        error
                    } = await db
                        .from("user_streaks")
                        .update({
                            sleep_current: current,
                            sleep_best: best,
                            updated_at: new Date().toISOString()
                        })
                        .eq("user_id", userId);

                    if (error) throw error;

                } else {

                    const {
                        error
                    } = await db
                        .from("user_streaks")
                        .insert({
                            user_id: userId,
                            sleep_current: 1,
                            sleep_best: 1
                        });

                    if (error) throw error;
                }

                return {
                    rewarded: points > 0,
                    points,
                    score,
                    streakCurrent: current,
                    streakBest: best,
                    reward
                };
            }

            return {
                rewarded: points > 0,
                points,
                score,
                streakCurrent: Number(
                    streakRow?.sleep_current || 0
                ),
                streakBest: Number(
                    streakRow?.sleep_best || 0
                ),
                reward
            };
        }

        /* ============================================================
   AURA 5C21 — MASTER AURA ENGINE
   ============================================================ */

        async function refreshAuraState_5C21() {

            const userId = dashboardState?.user?.id;

            if (!userId) {
                throw new Error("Authenticated user not available.");
            }

            /* ---------- WORKOUT REWARDS ---------- */

            const {
                data: workouts,
                error: wErr
            } = await db
                .from("workout_days")
                .select("id,workout_date,completed,aura_points")
                .eq("user_id", userId)
                .eq("completed", true);

            if (wErr) throw wErr;

            for (const w of workouts || []) {

                const {
                    data: exists,
                    error
                } = await db
                    .from("aura_transactions")
                    .select("id")
                    .eq("user_id", userId)
                    .eq("source", "workout")
                    .eq("source_id", w.id)
                    .limit(1);

                if (error) throw error;

                if (!exists?.length) {
                    await db.from("aura_transactions").insert({
                        user_id: userId,
                        transaction_date: w.workout_date,
                        source: "workout",
                        source_id: w.id,
                        points: Number(w.aura_points || 7),
                        description: "Workout completed"
                    });
                }
            }

            /* ---------- DIET REWARDS ---------- */

            const {
                data: diets,
                error: dErr
            } = await db
                .from("diet_days")
                .select("id,diet_date,completed,aura_points")
                .eq("user_id", userId)
                .eq("completed", true);

            if (dErr) throw dErr;

            for (const d of diets || []) {

                const {
                    data: exists,
                    error
                } = await db
                    .from("aura_transactions")
                    .select("id")
                    .eq("user_id", userId)
                    .eq("source", "diet")
                    .eq("source_id", d.id)
                    .limit(1);

                if (error) throw error;

                if (!exists?.length) {
                    await db.from("aura_transactions").insert({
                        user_id: userId,
                        transaction_date: d.diet_date,
                        source: "diet",
                        source_id: d.id,
                        points: Number(d.aura_points || 7),
                        description: "Diet day completed"
                    });
                }
            }

            /* ---------- TOTAL AURA ---------- */

            const {
                data: tx,
                error: txErr
            } = await db
                .from("aura_transactions")
                .select("points")
                .eq("user_id", userId);

            if (txErr) throw txErr;

            const auraTotal = (tx || []).reduce(
                (sum, row) => sum + Number(row.points || 0),
                0
            );

            /* ---------- DAILY COMPLETION DATES ---------- */

            const workoutDates = new Set(
                (workouts || []).map(w => w.workout_date)
            );

            const dietDates = new Set(
                (diets || []).map(d => d.diet_date)
            );

            const {
                data: waterTx,
                error: waterErr
            } = await db
                .from("aura_transactions")
                .select("transaction_date")
                .eq("user_id", userId)
                .eq("source", "water");

            if (waterErr) throw waterErr;

            const {
                data: sleepTx,
                error: sleepErr
            } = await db
                .from("aura_transactions")
                .select("transaction_date")
                .eq("user_id", userId)
                .eq("source", "sleep");

            if (sleepErr) throw sleepErr;

            const waterDates = new Set(
                (waterTx || []).map(x => x.transaction_date)
            );

            const sleepDates = new Set(
                (sleepTx || []).map(x => x.transaction_date)
            );

            /* ---------- STREAK CALCULATOR ---------- */

            const streak = dates => {

                const set = new Set(dates);

                const all = [...set].sort();

                let best = 0;
                let current = 0;

                for (let i = 0; i < all.length; i++) {

                    if (
                        i > 0 &&
                        (new Date(all[i]) - new Date(all[i - 1])) /
                        86400000 === 1
                    ) {
                        current++;
                    } else {
                        current = 1;
                    }

                    best = Math.max(best, current);
                }

                if (!all.length) {
                    return {
                        current: 0,
                        best: 0
                    };
                }

                const today = new Date().toISOString().slice(0, 10);
                const yesterday = new Date(
                    Date.now() - 86400000
                ).toISOString().slice(0, 10);

                let active = 0;
                let cursor =
                    set.has(today) ?
                        today :
                        set.has(yesterday) ?
                            yesterday :
                            null;

                while (cursor && set.has(cursor)) {
                    active++;
                    cursor = new Date(
                        new Date(cursor).getTime() - 86400000
                    ).toISOString().slice(0, 10);
                }

                return {
                    current: active,
                    best
                };
            };

            const workoutStreak = streak(workoutDates);
            const dietStreak = streak(dietDates);
            const waterStreak = streak(waterDates);
            const sleepStreak = streak(sleepDates);

            /* ---------- OVERALL STREAK ----------
               A day counts when all 4 pillars are completed.
            */

            const overallDates = [...workoutDates].filter(
                d =>
                    dietDates.has(d) &&
                    waterDates.has(d) &&
                    sleepDates.has(d)
            );

            const overallStreak = streak(overallDates);

            /* ---------- SAVE STREAKS ---------- */

            const streakPayload = {
                user_id: userId,
                workout_current: workoutStreak.current,
                workout_best: workoutStreak.best,
                diet_current: dietStreak.current,
                diet_best: dietStreak.best,
                water_current: waterStreak.current,
                water_best: waterStreak.best,
                sleep_current: sleepStreak.current,
                sleep_best: sleepStreak.best,
                overall_current: overallStreak.current,
                overall_best: overallStreak.best,
                updated_at: new Date().toISOString()
            };

            const {
                error: streakSaveError
            } = await db
                .from("user_streaks")
                .upsert(streakPayload, {
                    onConflict: "user_id"
                });

            if (streakSaveError) throw streakSaveError;

            const result = {
                auraTotal,
                workoutStreak,
                dietStreak,
                waterStreak,
                sleepStreak,
                overallStreak
            };

            dashboardState.auraTotal = auraTotal;
            dashboardState.user_streaks = streakPayload;

            console.log(
                "AURA 5C21: Master state:",
                result
            );

            return result;
        }

        function validateAuraDecision_19D(d) {

            const errors = [];

            if (!d?.workout) errors.push("Missing workout");
            if (!d?.diet) errors.push("Missing diet");
            if (!d?.water) errors.push("Missing water");
            if (!d?.sleep) errors.push("Missing sleep");

            if (d?.workout) {
                if (!d.workout.title) errors.push("Workout title missing");
                if (!Number.isFinite(d.workout.duration_minutes))
                    errors.push("Workout duration invalid");

                if (!Array.isArray(d.workout.exercises) ||
                    !d.workout.exercises.length)
                    errors.push("Workout exercises missing");
            }

            if (d?.diet) {
                if (!Number.isFinite(d.diet.daily_calories))
                    errors.push("Calories invalid");

                if (!Number.isFinite(d.diet.protein_g))
                    errors.push("Protein invalid");

                if (!Array.isArray(d.diet.meals) ||
                    !d.diet.meals.length)
                    errors.push("Diet meals missing");
            }

            if (d?.water) {
                if (!Number.isFinite(d.water.target_ml) ||
                    d.water.target_ml <= 0)
                    errors.push("Water target invalid");
            }

            if (d?.sleep) {
                if (!Number.isFinite(d.sleep.target_hours) ||
                    d.sleep.target_hours <= 0)
                    errors.push("Sleep target invalid");

                if (!d.sleep.bedtime)
                    errors.push("Bedtime missing");

                if (!d.sleep.wake_time)
                    errors.push("Wake time missing");
            }

            const valid = errors.length === 0;

            console.log(
                "AURA 19D: VALIDATION:", {
                valid,
                errors
            }
            );

            return {
                valid,
                errors,
                decision: valid ? d : null
            };

            let result;

            switch (pillar) {

        /* ============================================================
           AURA 19K — UNIFIED GAMIFICATION ACTION
           ============================================================ */

        async function completeAuraAction_19K(
            action,
            context = {}
        ) {

            console.log(
                "AURA 19K: Completing action:",
                action,
                context
            );

            if (!dashboardState?.user?.id) {
                throw new Error(
                    "Authenticated user not available."
                );
            }

            const normalizedAction =
                String(action || "")
                    .trim()
                    .toLowerCase();

            let result;

            switch (normalizedAction) {

                /* --------------------------------------------------------
                   WORKOUT
                   -------------------------------------------------------- */

                case "workout": {

                    const workoutDayId =
                        context.workoutDayId ||
                        context.id;

                    if (!workoutDayId) {
                        throw new Error(
                            "Workout day ID is required."
                        );
                    }

                    result =
                        await completeWorkoutDay_5C9(
                            workoutDayId
                        );

                    break;
                }


                /* --------------------------------------------------------
                   DIET
                   -------------------------------------------------------- */

                case "diet": {

                    const dietPlanId =
                        context.dietPlanId ||
                        context.planId;

                    const dietDate =
                        context.dietDate ||
                        context.date;

                    if (!dietPlanId || !dietDate) {
                        throw new Error(
                            "Diet plan ID and diet date are required."
                        );
                    }

                    result =
                        await completeDietDay_5C14(
                            dietPlanId,
                            dietDate
                        );

                    break;
                }


                /* --------------------------------------------------------
                   WATER
                   -------------------------------------------------------- */

                case "water": {

                    const date =
                        context.date ||
                        new Date();

                    result =
                        await completeWaterDay_5C18(
                            date
                        );

                    break;
                }


                /* --------------------------------------------------------
                   SLEEP
                   -------------------------------------------------------- */

                case "sleep": {

                    const sleepId =
                        context.sleepId ||
                        context.id;

                    if (!sleepId) {
                        throw new Error(
                            "Sleep ID is required."
                        );
                    }

                    result =
                        await completeSleepDay_5C20(
                            sleepId
                        );

                    break;
                }


                /* --------------------------------------------------------
                   INVALID ACTION
                   -------------------------------------------------------- */

                default:

                    throw new Error(
                        `Unsupported Aura action: ${action}`
                    );
            }


            /* ------------------------------------------------------------
               REFRESH MASTER GAMIFICATION STATE
               ------------------------------------------------------------ */

            const gamification =
                await refreshAuraState_5C21();


            /* ------------------------------------------------------------
               EVALUATE BADGES
               ------------------------------------------------------------ */

            const badges =
                await evaluateBadges_5C23();


            const finalResult = {

                action: normalizedAction,

                result,

                gamification,

                badges

            };


            console.log(
                "AURA 19K: ACTION COMPLETE:",
                finalResult
            );


            return finalResult;
        }
